[project]
name = "LLLM"
version = "0.1.0"
description = "Leon's LLM."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ruff",
    "pyright",
    "strictyaml",
    "torch",
    "numpy",
    "tiktoken",
    "matplotlib",
    "click",
    "tensorflow",
    "tqdm",
    "pandas",
    "huggingface-hub",
    "safetensors",
    "tokenizers",
    "transformers",
    "datasets",
    "docker",
    "sentencepiece", # LLama2 tokenizer
    "gguf",
    "loguru",
    "requests",
    "textual>=8.2.7",
    "pydantic"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
coder = "LLLM.coder:coder_cli"
chat = "LLLM.chat:chat_cli"
planner = "LLLM.planner:planner_cli"
# 
# [tool.uv]
# package = true

[dependency-groups]
build = ["pyright", "ruff"]
dev =  ["pytest-cov", "pytest", "pytest-dependency"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
# suppresses errors where Pyright thinks public Torch APIs is not correctly exported by pytorch.
reportMissingTypeStubs = false
# suppresses errors for libraries that do not ship complete type stubs.
reportPrivateImportUsage = false

[tool.ruff]
exclude = ["tests"]

[tool.pytest.ini_options]
addopts = [
    "--cov=LLLM",
    "-s",
    "--log-cli-level=INFO"
]
markers = [
    "slow: tests that download remote models or run long evaluations",
]

[tool.setuptools]
packages = ["LLLM"]
